[project]
name = "automation-app-damai"
version = "0.3.0"
description = "Damai application workflows built on automation-kit"
authors = [{ name = "mango" }]
readme = "README.md"
requires-python = ">=3.8,<4.0"
# 兼容范围声明，不是「从包源可解析」的发布依赖：automation-kit 未上任何包源，
# 本仓本地与 CI 的实际取用方式是 monorepo sibling 检出 + `pip install -e ../automation-kit`
# （见 [tool.poetry.dependencies] 的 path 依赖与 ci.yml），这一行从不被包源解析，
# 只记录适配的版本区间。若将来 kit 上架，本行即为可直接解析的依赖，无需改动。
dependencies = [
    "automation-kit>=0.5.0,<0.6.0",
]

[project.optional-dependencies]
live = [
    "playwright>=1,<2",
]
live-patchright = [
    "patchright>=1,<2",
]

[tool.poetry.dependencies]
automation-kit = { path = "../automation-kit", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automation_app_damai*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=automation_app_damai",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["automation_app_damai"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
